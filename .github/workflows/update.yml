name: Aktualizuj kalendarz F1

# Co godzinę uruchamia się tylko szybkie sprawdzenie (bez zapytań do API F1).
# Pełna aktualizacja rusza 3, 6 i 8 godzin po kwalifikacjach, sprincie i wyścigu,
# raz w tygodniu (poniedziałek rano, na wypadek zmian w terminarzu),
# po każdym pushu i po ręcznym uruchomieniu.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ICS_URL: https://norbertcala.github.io/f1-calendar/f1.ics

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python3 f1_calendar.py --check "$ICS_URL"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generuj f1.ics
        run: |
          mkdir -p public
          cp web/index.html public/
          mkdir -p public/podglad-techlove && cp techlove/f1/index.html public/podglad-techlove/
          python f1_calendar.py --out public/f1.ics
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
